<div #tableRoot class="data-table">
    <div if="{$search || $add || $addLink || isset($_slots['actions'])}" class="row data-table-toolbar">
        <div if="$search" class="col col-md-6 col-lg-4 col-12 pb-4">
            <!-- Debounced: a server-backed list re-fetched once typing pauses, not per keystroke. -->
            <SearchInput model="$searchValue" (search)="onSearch" debounce="{300}" label="Search" placeholder="Search" />
        </div>
        <!-- Flex with a gap, so buttons that run out of room wrap onto a second line with space
             between them instead of touching. Slot buttons need no margins of their own. -->
        <div if="{$add || $addLink || isset($_slots['actions'])}"
            class="col col-md-6 col-lg-8 col-12 pb-4 d-flex flex-wrap justify-content-end align-items-start gap-2 data-table-actions">
            <!-- 'actions' slot: extra toolbar buttons rendered inline before the Add button. -->
            <slot name="actions"></slot>
            <button if="{$add || $addLink}" type="button" class="btn btn-primary" (click)="onCreate">
                <div class="d-flex align-items-center">
                    <Icon name="bi-plus-square" classList="bi me-2" width="1.5em" height="1.5em" />
                    $addText
                </div>
            </button>
        </div>
    </div>


    <!-- Bulk bar: the count, the page's own actions (the 'selection' slot) and a way out. It keeps
         its space while nothing is selected, showing the hint instead, so ticking the first row
         never pushes the table down. A labelled region, so a screen reader says what it is for. -->
    <div if="$selectable" class="data-table-selection d-flex flex-wrap align-items-center gap-2"
        class.data-table-selection-idle="{$selectedCount === 0}" class.data-table-selection-stacked="$stacked"
        role="region" aria-label="Selected rows">
        <!-- Select-all for stacked cards, which hide the table header (shown below 920px only). -->
        <input type="checkbox" class="form-check-input m-0 data-table-select-all" checked="{$allSelected}"
            (change)="toggleAll" aria-label="Select every row on this page" />
        <!-- A real element, not <template>: a <template> around the slot rendered the Clear button
             empty, with its label outside it as loose text. -->
        <div if="{$selectedCount > 0}" class="d-flex flex-wrap align-items-center gap-2">
            <span class="fw-semibold">{$selectedCount} selected</span>
            <slot name="selection"></slot>
            <button type="button" class="btn btn-sm btn-link" (click)="clearSelection">Clear selection</button>
        </div>
        <span else class="small text-muted">{$selectionHint}</span>
    </div>

    <!-- Scrolls sideways instead of pushing the page wider than the phone. -->
    <div if="{count($items) > 0}" class="table-responsive">
        <table class="table align-middle mt-4" class.table-stacked="$stacked" class.table-selectable="$selectable">
            <thead>
                <tr>
                    <th if="$selectable" scope="col" class="table-select">
                        <input type="checkbox" class="form-check-input" checked="{$allSelected}"
                            (change)="toggleAll" aria-label="Select every row on this page" />
                    </th>
                    <th foreach="$columns as $column" scope="col" class="{$column->cssClass ?? ''}">{$column->title ?? $column->key}</th>
                    <th if="{$remove || $edit}" scope="col" class="text-center">
                        Actions
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr foreach="$items as $item" class.table-selected="{$selectable && in_array($item->{$selectKey}, $selectedKeys, true)}"
                    draggable="{$draggableRows ? 'true' : null}" (dragstart)="onRowDragStart($item, $event)"
                    (dragend)="onRowDragEnd">
                    <td if="$selectable" class="table-select">
                        <input type="checkbox" class="form-check-input"
                            checked="{in_array($item->{$selectKey}, $selectedKeys, true)}" (change)="toggleRow($item)"
                            aria-label="Select this row" />
                    </td>
                    <template foreach="$columns as $column">
                        <template if="{$changeMode && isset($_slots['edit_' . $column->key]) && $item === $editItem}">
                            <slot name="{'edit_' . $column->key}" data="$item"></slot>
                        </template>
                        <template else-if="{isset($_slots['column_' . $column->key])}">
                            <slot name="{'column_' . $column->key}" data="$item"></slot>
                        </template>
                        <template else-if="{$column->template}">
                            <{$column->template} data="$item" value="{$item->{$column->key}}" label="{$column->title ?? $column->key}" />
                        </template>
                        <td else data-label="{$column->title ?? $column->key}">{$item->{$column->key}}</td>
                    </template>
                    <td if="{$remove || $edit}" class="table-stacked-actions">
                        <div class="d-flex d-flex justify-content-center">
                            <button if="{$edit && (!$changeMode || $item !== $editItem)}" class="btn btn-sm btn-rounded btn-rounded-primary" type="button"
                                (click)="onEdit($item)">
                                <Icon name="bi-pen" />
                            </button>
                            <button if="{$remove && (!$changeMode || $item !== $editItem)}" class="btn btn-sm btn-rounded btn-rounded-primary ms-2"
                                type="button" (click)="onDelete($item)">
                                <Icon name="bi-trash" />
                            </button>
                            <button if="{$changeMode && $item === $editItem}" class="btn btn-sm btn-rounded btn-rounded-primary" type="button"
                                (click)="onSave($item)">
                                <Icon name="bi-floppy" />
                            </button>
                            <button if="{$changeMode && $item === $editItem}" class="btn btn-sm btn-rounded btn-rounded-primary ms-2" type="button"
                                (click)="onCancel($item)">
                                <Icon name="bi-x-circle" />
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- Nothing to list: explain what belongs here and offer the create action,
         instead of leaving a bare header over blank space. Pass emptyIcon/
         emptyTitle/emptyText to tailor the copy, or fill the 'empty' slot to
         replace the whole block. -->
    <div if="{count($items) === 0}">
        <!-- Filtered to nothing: offer to clear the search, never "add your first". -->
        <EmptyState if="{isFiltered()}" icon="bi-search" title="No matches"
            description="Nothing matched your search. Try a different term.">
            <slotContent name="action">
                <button type="button" class="btn btn-outline-secondary" (click)="clearSearch">Clear search</button>
            </slotContent>
        </EmptyState>
        <slot if="{!isFiltered() && isset($_slots['empty'])}" name="empty"></slot>
        <EmptyState if="{!isFiltered() && !isset($_slots['empty'])}" icon="$emptyIcon" title="$emptyTitle"
            description="$emptyText">
            <slotContent name="action">
                <button if="{$add || $addLink}" type="button" class="btn btn-primary" (click)="onCreate">$addText</button>
            </slotContent>
        </EmptyState>
    </div>
    <div if="{$paging && count($items) > 0}" class="row mt-4 align-items-center">
        <div class="col-md-6 col-12 center-sm d-flex flex-wrap align-items-center gap-2">
            <span>Showing {$filter->paging->entityFrom} to {$filter->paging->entityTo} of {$filter->paging->total} entries</span>
            <!-- Rows per page: a bigger page is how someone acts on more rows at once, since a
                 selection covers the page it is on. -->
            <select if="{count($pageSizes) > 0}" class="form-select form-select-sm w-auto"
                aria-label="Rows per page" (change)="onPageSize($event)">
                <option foreach="$pageSizes as $size" value="{$size}" selected="{$size === $filter->paging->size}">{$size} per page</option>
            </select>
        </div>
        <div class="text-right col-md-6 col-12 center-sm">
            <Pagination paging="$filter->paging" (change)="onPageChange" />
        </div>
    </div>
</div>
