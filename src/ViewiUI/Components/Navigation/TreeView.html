<div class="tree-view" role="tree" aria-label="$label" #treeRoot (keydown)="onKey($event)">
    <div foreach="$items as $index => $node" role="none" class="tree-view-row d-flex align-items-center"
        class.active="{isSelected($node)}" style="{indentOf($node)}">
        <div if="{$editingKey !== null && $node->key === $editingKey}" class="flex-grow-1">
            <slot name="edit" data="$node"></slot>
        </div>
        <button else type="button" role="treeitem" class="btn btn-sm flex-grow-1 text-start tree-view-item"
            class.active="{isSelected($node)}" aria-level="{levelOf($node)}"
            aria-selected="{isSelected($node) ? 'true' : 'false'}" tabindex="{tabIndexOf($index)}"
            title="{$node->title}" (click)="select($node, $index)" (focus)="onFocus($index)">
            <span class="d-flex justify-content-between align-items-center">
                <span class="text-truncate"><Icon if="$node->icon" name="$node->icon" classList="me-2" />{$node->label}</span>
                <span if="{$node->badge !== ''}" class="badge text-bg-light ms-2">{$node->badge}</span>
            </span>
        </button>
        <div class="tree-view-actions"><slot name="actions" data="$node"></slot></div>
    </div>
</div>
